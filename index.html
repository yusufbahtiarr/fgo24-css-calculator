<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="./src/index.css">
</head>
<body>
  <div class="container">
    <div class="calculator">
      <div class="display">
        <div class="result">474</div>
        <div class="operation">74-4+404=474</div>
      </div>
      <div class="button">
        <button class="a">C</button>
        <button class="a">+/-</button>
        <button class="a">%</button>
        <button class="b">/</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="b">X</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="b">-</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="b">+</button>
        <button>0</button>
        <button>.</button>
        <button>⌫</button>
        <button class="c">=</button>
      </div>
    </div>
  </div>
</body>
</html>
